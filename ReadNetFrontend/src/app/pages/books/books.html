<h2>Gestión de Libros</h2>

<div class="toolbar">
    <button class="btn-primary">
        + Nuevo Libro
    </button>
</div>

<table class="data-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>ISBN</th>
            <th>Año</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>
        @for (book of books; track book.id) {
            <tr>
                <td>{{ book.id }}</td>
                <td>{{ book.title }}</td>
                <td>{{ book.isbn }}</td>
                <td>{{ book.publishYear }}</td>
                <td>
                    <button class="btn-edit">Editar</button>
                    <button class="btn-delete">Eliminar</button>
                </td>
            </tr>
        }
    </tbody>
</table>
