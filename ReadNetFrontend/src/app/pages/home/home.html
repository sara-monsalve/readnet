<div class="dashboard">

    <h1>📚 ReadNet Library System</h1>

    <p class="subtitle">
        Sistema de Gestión Bibliotecaria
    </p>

    <div class="cards">

        <div class="card">
            <h2>👨‍💼 Autores</h2>
            <div class="number">
                {{ totalAuthors }}
            </div>
        </div>

        <div class="card">
            <h2>📖 Libros</h2>
            <div class="number">
                {{ totalBooks }}
            </div>
        </div>

        <div class="card">
            <h2>👥 Miembros</h2>
            <div class="number">
                {{ totalMembers }}
            </div>
        </div>

    </div>

</div>
