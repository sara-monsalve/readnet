<h2>Gestión de Miembros</h2>

<div class="toolbar">
    <button class="btn-primary" (click)="openForm()">
        + Nuevo Miembro
    </button>
</div>

@if (showForm) {

<div class="form-card">

    <h3>
        {{ isEditing ? 'Editar Miembro' : 'Nuevo Miembro' }}
    </h3>

    <div class="form-group">
        <label>Nombre Completo</label>
        <input
            type="text"
            [(ngModel)]="newMember.fullName">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input
            type="email"
            [(ngModel)]="newMember.email">
    </div>

    <div class="form-group">
        <label>Teléfono</label>
        <input
            type="text"
            [(ngModel)]="newMember.phone">
    </div>

    <button
        class="btn-primary"
        (click)="saveMember()">
        {{ isEditing ? 'Actualizar' : 'Guardar' }}
    </button>

</div>

}

<table class="data-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre Completo</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>
        @for (member of members; track member.id) {
        <tr>
            <td>{{ member.id }}</td>
            <td>{{ member.fullName }}</td>
            <td>{{ member.email }}</td>
            <td>{{ member.phone }}</td>
            <td>

                <button
                    class="btn-edit"
                    (click)="editMember(member)">
                    Editar
                </button>

                <button
                    class="btn-delete"
                    (click)="deleteMember(member.id)">
                    Eliminar
                </button>

            </td>
        </tr>
        }
    </tbody>
</table>
